name: staleness
# Fails when a playbook, portal guide, routine, calendar.md or GOTCHAS.md hasn't been re-verified in 12 months.
on:
  schedule:
    - cron: "0 9 15 1 *"   # 15 January, after the new IAS and OE are out
  workflow_dispatch:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/staleness-check.py --months 12
